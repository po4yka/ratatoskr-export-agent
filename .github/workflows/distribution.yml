name: distribution

on:
  workflow_dispatch:
    inputs:
      short_version:
        description: Application short version, for example 1.0.0
        required: true
        type: string
      build_version:
        description: Positive integer bundle build version
        required: true
        type: string
      source_revision:
        description: Exact full commit SHA to build and release
        required: true
        type: string
      release_tag:
        description: Existing annotated tag, exactly v plus short_version
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: distribution-${{ github.ref }}
  cancel-in-progress: false

jobs:
  notarized-app:
    permissions:
      contents: read
    runs-on: macos-15
    timeout-minutes: 60
    env:
      APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64 }}
      APPLE_DEVELOPER_ID_APPLICATION_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
      APPLE_NOTARY_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY_BASE64 }}
      RELEASE_SHORT_VERSION: ${{ inputs.short_version }}
      RELEASE_BUILD_VERSION: ${{ inputs.build_version }}
      RELEASE_SOURCE_REVISION: ${{ inputs.source_revision }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_revision }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate immutable source and tag
        run: |
          set -euo pipefail
          [[ "$RELEASE_SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [ "$RELEASE_TAG" = "v$RELEASE_SHORT_VERSION" ]
          [ "$(git rev-parse HEAD)" = "$(git rev-parse "${RELEASE_SOURCE_REVISION}^{commit}")" ]
          [ "$(git cat-file -t "$RELEASE_TAG")" = "tag" ]
          [ "$(git rev-parse "${RELEASE_TAG}^{commit}")" = "$(git rev-parse HEAD)" ]
      - name: Validate owner authorization
        run: scripts/distribution/validate-owner-secrets.sh
      - name: Build release executable
        run: swift build -c release
      - name: Run distribution structure and policy tests
        run: Tests/Distribution/run.sh
      - name: Sign, notarize, staple, and validate
        run: |
          scripts/distribution/sign-and-notarize.sh \
            --binary .build/release/RatatoskrExportAgent \
            --output "$RUNNER_TEMP/distribution" \
            --short-version "$RELEASE_SHORT_VERSION" \
            --build-version "$RELEASE_BUILD_VERSION"
      - name: Upload notarized application
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: RatatoskrExportAgent-${{ inputs.short_version }}-notarized
          path: |
            ${{ runner.temp }}/distribution/*.zip
            ${{ runner.temp }}/distribution/*.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    needs: notarized-app
    runs-on: macos-15
    timeout-minutes: 10
    permissions:
      contents: write # to create the immutable GitHub Release and upload its accepted assets
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHORT_VERSION: ${{ inputs.short_version }}
      RELEASE_SOURCE_REVISION: ${{ inputs.source_revision }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_revision }}
          fetch-depth: 0
          persist-credentials: false
      - name: Revalidate source, tag, and absent release
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$(git rev-parse "${RELEASE_SOURCE_REVISION}^{commit}")" ]
          [ "$(git cat-file -t "$RELEASE_TAG")" = "tag" ]
          [ "$(git rev-parse "${RELEASE_TAG}^{commit}")" = "$(git rev-parse HEAD)" ]
          response=$(gh api --include "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" 2>&1) && {
            echo "release already exists: $RELEASE_TAG" >&2
            exit 1
          }
          grep -q '^HTTP/.* 404' <<<"$response" || {
            printf '%s\n' "$response" >&2
            exit 1
          }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: RatatoskrExportAgent-${{ inputs.short_version }}-notarized
          path: ${{ runner.temp }}/release-assets
      - name: Verify and publish immutable release assets
        working-directory: ${{ runner.temp }}/release-assets
        run: |
          set -euo pipefail
          shopt -s nullglob
          zips=(./*.zip)
          sums=(./*.sha256)
          [ "${#zips[@]}" -eq 1 ] && [ "${#sums[@]}" -eq 1 ]
          shasum -a 256 -c "${sums[0]}"
          gh release create "$RELEASE_TAG" "${zips[0]}" "${sums[0]}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --target "$RELEASE_SOURCE_REVISION" \
            --title "Ratatoskr Export Agent $RELEASE_SHORT_VERSION" \
            --notes "Signed and notarized Ratatoskr Export Agent $RELEASE_SHORT_VERSION."
